# Copied verbatim into every project. Everything project-specific comes from the
# .env file beside it, which is why this file is identical everywhere.
#
# Command: it uses the db_data and wp_data volumes plus the project host directory it
# was invoked from.

name: ${PROJECT_NAME}

x-wordpress-env: &wordpress-env
    WORDPRESS_DB_HOST: db:3306
    WORDPRESS_DB_USER: wordpress
    WORDPRESS_DB_PASSWORD: wordpress
    WORDPRESS_DB_NAME: wordpress
    WORDPRESS_DEBUG: "1"
    # Applies to every request, including WP-CLI, so both containers share it.
    # Application passwords require SSL unless the environment reports itself as
    # local, which is why WP_ENVIRONMENT_TYPE is set here.
    WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'SCRIPT_DEBUG', true );
        define( 'FS_METHOD', 'direct' );
        define( 'WP_MEMORY_LIMIT', '512M' );

x-wordpress-volumes: &wordpress-volumes
    # Core files live in a named volume that the image populates on first run.
    - wp_data:/var/www/html
    # The shared plugin is mounted from the kit: one copy, every project.
    - ${WP_AGENT_PLUGIN_DIR}:/var/www/html/wp-content/plugins/wp-agent-bridge
    # Project code and uploads, so the agent can read and write them directly.
    - ./wp-content/themes/${PROJECT_THEME}:/var/www/html/wp-content/themes/${PROJECT_THEME}
    - ./wp-content/uploads:/var/www/html/wp-content/uploads
    # wpdev:extra-mounts

services:
    db:
        image: mariadb:11
        restart: unless-stopped
        environment:
            MARIADB_DATABASE: wordpress
            MARIADB_USER: wordpress
            MARIADB_PASSWORD: wordpress
            MARIADB_ROOT_PASSWORD: root
        volumes:
            - db_data:/var/lib/mysql
        healthcheck:
            test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
            interval: 5s
            timeout: 5s
            retries: 30

    wordpress:
        image: ${WPDEV_IMAGE}
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "${WP_PORT}:80"
        environment: *wordpress-env
        volumes: *wordpress-volumes

    # Started only on demand by wpdev, never by `docker compose up`.
    cli:
        image: ${WPDEV_IMAGE}
        depends_on:
            db:
                condition: service_healthy
        # www-data is mapped to your host uid in the image, so files this writes
        # into a mounted directory belong to you on the host.
        user: www-data
        working_dir: /var/www/html
        entrypoint: [ "wp" ]
        environment: *wordpress-env
        volumes: *wordpress-volumes

volumes:
    db_data:
    wp_data:
